services:
  mysql:
    image: mysql:8.4
    container_name: cleanwash-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-cleanwash_root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-cleanwash}
      MYSQL_USER: ${DB_USERNAME:-cleanwash}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cleanwash_secret}
      TZ: Asia/Jakarta
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - cleanwash_mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent && mysql -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD -e 'SELECT 1' cleanwash_testing >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

volumes:
  cleanwash_mysql_data:
